
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10243a">
  <title>Nepal Clock</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="clock-widget">

    <div class="header">
      <span>🇳🇵 NEPAL CLOCK</span>
      <span>NP • UTC +5:45</span>
    </div>

    <div class="time" id="time">00:00:00</div>
    <div class="ampm" id="ampm">AM</div>

    <div class="english-date" id="englishDate"></div>

    <div class="line"></div>

    <div class="calendar-label">
      BIKRAM SAMBAT
    </div>

    <div class="nepali-date" id="nepaliDate">
      Loading Nepali date...
    </div>

    <div class="nepali-day" id="nepaliDay"></div>

    <div class="footer">
      KATHMANDU • NEPAL STANDARD TIME
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js"></script>
  <script src="script.js"></script>
</body>
</html>
